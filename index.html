<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LPT</title>

    <link
        rel="icon"
        type="image/png"
        href="https://res.cloudinary.com/dkui88bcf/image/upload/v1786939501/Logo_LPT_vnq390.png"
    >

    <style>
        :root {
            --bg: #0a0e12;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        body {
            position: relative;
        }

        /* =========================
           BACKGROUND
        ========================= */

        #bg-image {
            position: fixed;
            inset: 0;
            z-index: -3;

            background-image:
                url("https://res.cloudinary.com/dkui88bcf/image/upload/v1786093084/ThoBayMau_txlygo.jpg");

            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;

            filter:
                blur(4px)
                brightness(0.65)
                saturate(0.95);

            transform: scale(1.04);
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: -2;

            width: 100%;
            height: 100%;

            display: block;
            pointer-events: none;
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;
            z-index: -1;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(255, 184, 77, 0.08),
                    transparent 55%
                ),

                radial-gradient(
                    circle at 15% 85%,
                    rgba(111, 224, 138, 0.05),
                    transparent 50%
                ),

                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px
                );

            background-size:
                auto,
                auto,
                22px 22px;

            pointer-events: none;
        }

        body::after {
            content: "";

            position: fixed;
            inset: 0;
            z-index: -1;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(10, 14, 18, 0.25) 0%,
                    rgba(10, 14, 18, 0.55) 55%,
                    rgba(10, 14, 18, 0.75) 100%
                );

            pointer-events: none;
        }

        /* =========================
           POWERPOINT BUTTON
        ========================= */

        .powerpoint-btn {
            position: fixed;

            top: 14px;
            right: 14px;

            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 11px;

            background: rgba(255, 255, 255, 0.06);

            cursor: pointer;

            z-index: 99999;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .powerpoint-btn:hover {
            transform: translateY(-2px);

            background:
                rgba(255, 255, 255, 0.11);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .powerpoint-btn:active {
            transform: scale(0.94);
        }

        .powerpoint-btn svg {
            width: 27px;
            height: 27px;

            display: block;
        }
    </style>
</head>

<body>

    <!-- BACKGROUND -->
    <div id="bg-image"></div>

    <canvas id="bg-canvas"></canvas>

    <!-- POWERPOINT BUTTON -->
    <button
        class="powerpoint-btn"
        id="powerpointBtn"
        type="button"
        title="Tải PowerPoint"
        aria-label="Tải PowerPoint"
    >
        <svg viewBox="0 0 32 32" aria-hidden="true">

            <path
                fill="#e85d3f"
                d="M4 4h17c3.87 0 7 3.13 7 7v10c0 3.87-3.13 7-7 7H4z"
            />

            <path
                fill="white"
                d="M11 9h5.2c3.3 0 5.3 1.8 5.3 4.7s-2 4.7-5.3 4.7H14V23h-3zm3 2.5v4.4h2c1.5 0 2.5-.8 2.5-2.2s-1-2.2-2.5-2.2z"
            />

        </svg>
    </button>

    <script>
        /* =========================
           POWERPOINT DOWNLOAD
        ========================= */

        const POWERPOINT_URL =
            "https://drive.usercontent.google.com/download?id=1dpW6-eUdZ28Xb0qGH3IecP8ql3566H2f&export=download&authuser=0&confirm=t&uuid=e386bb02-ca99-449b-a161-39b9418b8428&at=AMrWOn2mmrR_NZaVDkaq1ZJkmBec:1790662887529";

        document
            .getElementById("powerpointBtn")
            .addEventListener("click", () => {

                const a = document.createElement("a");

                a.href = POWERPOINT_URL;

                a.download = "LPT-PowerPoint.pptx";

                a.target = "_blank";

                a.rel = "noopener noreferrer";

                document.body.appendChild(a);

                a.click();

                a.remove();
            });


        /* =========================
           STAR BACKGROUND
        ========================= */

        const canvas =
            document.getElementById("bg-canvas");

        const ctx =
            canvas.getContext("2d");

        let stars = [];


        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

            createStars();
        }


        function createStars() {

            stars = [];

            const amount =
                Math.min(
                    120,
                    Math.floor(
                        window.innerWidth *
                        window.innerHeight /
                        10000
                    )
                );


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                stars.push({

                    x:
                        Math.random() *
                        canvas.width,

                    y:
                        Math.random() *
                        canvas.height,

                    size:
                        Math.random() * 1.5,

                    speed:
                        Math.random() *
                        0.15 +
                        0.03,

                    opacity:
                        Math.random() *
                        0.5 +
                        0.2
                });
            }
        }


        function drawStars() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            for (
                const star of stars
            ) {

                star.y +=
                    star.speed;


                if (
                    star.y >
                    canvas.height
                ) {

                    star.y = 0;

                    star.x =
                        Math.random() *
                        canvas.width;
                }


                ctx.beginPath();


                ctx.arc(
                    star.x,
                    star.y,
                    star.size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `rgba(
                        255,
                        255,
                        255,
                        ${star.opacity}
                    )`;


                ctx.fill();
            }


            requestAnimationFrame(
                drawStars
            );
        }


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        resizeCanvas();

        drawStars();
    </script>

</body>

</html>
